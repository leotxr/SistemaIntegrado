services:
  app:
    build:
      context: .
    ports:
      - "8000:80"
    env_file:
      - .env
    environment:
      APP_URL: ${DOCKER_APP_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DOCKER_DB_DATABASE:-laravel}
      DB_USERNAME: ${DOCKER_DB_USERNAME:-laravel}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-localdev}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_DATABASE:-laravel}
      MYSQL_USER: ${DOCKER_DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-localdev}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-localroot}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  app_storage:
  mysql_data:
